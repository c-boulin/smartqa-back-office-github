name: Deploy front
description: Build the Vite app, sync it to S3 and invalidate CloudFront

inputs:
  stage:
    required: true
  account-id:
    required: true
  bucket:
    required: true
  distribution-id:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "20"
        cache: npm
    - name: Install and build
      shell: bash
      run: |
        npm ci
        npm run build-${{ inputs.stage }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: arn:aws:iam::${{ inputs.account-id }}:role/dv-github-smartqa-app-deployment
        aws-region: eu-west-1
        role-session-name: github-${{ github.run_id }}-deploy-${{ inputs.stage }}
    - name: Sync and invalidate
      shell: bash
      run: |
        aws s3 sync dist/ "s3://${{ inputs.bucket }}/" --delete
        aws cloudfront create-invalidation --distribution-id "${{ inputs.distribution-id }}" --paths "/*"
