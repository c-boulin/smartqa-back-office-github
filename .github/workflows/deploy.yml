name: Deploy

on:
  push:
    branches:
      - master
      - develop-*
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      stage:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - dev
          - stag
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy dev
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'dev') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/develop-'))
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-front
        with:
          stage: dev
          account-id: "679799247858"
          bucket: smartqa-dev-backoffice-s3
          distribution-id: EUUFAWIMAZXPX

  deploy-stag:
    name: Deploy stag
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'stag') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    environment: stag
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-front
        with:
          stage: stag
          account-id: "963496677041"
          bucket: smartqa-stag-backoffice-s3
          distribution-id: E25NWH15U8C9I7

  deploy-prod:
    name: Deploy prod
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'prod') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/deploy-front
        with:
          stage: prod
          account-id: "926783724271"
          bucket: smartqa-prod-backoffice-s3
          distribution-id: E2UZQUWUZFM3OT
